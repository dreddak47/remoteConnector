<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1117" />
  <title>Connect</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖱️</text></svg>" />
</head>
<body>
  <main id="app">
    <h1>Connect to your Mac</h1>
    <p class="hint">Open the menu bar app on your Mac to see its 6-digit code, then enter it below. Your phone must be on the same Wi-Fi network as the Mac.</p>

    <form id="code-form" autocomplete="off">
      <div id="digits" class="digits">
        <input class="digit" inputmode="numeric" maxlength="1" />
        <input class="digit" inputmode="numeric" maxlength="1" />
        <input class="digit" inputmode="numeric" maxlength="1" />
        <input class="digit" inputmode="numeric" maxlength="1" />
        <input class="digit" inputmode="numeric" maxlength="1" />
        <input class="digit" inputmode="numeric" maxlength="1" />
      </div>
      <button id="connect-btn" type="submit" disabled>Connect</button>
    </form>

    <p id="msg" class="msg" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
